server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cachear assets con hash (Astro los versiona en /_astro)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fuentes e imágenes
    location ~* \.(woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Servir el sitio; 404 -> página 404 de Astro si existe
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
